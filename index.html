/* ---------- helpers / hooks ---------- */

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);

  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActive(entry.target.id);
        });
      },
      { rootMargin: "-45% 0px -50% 0px", threshold: 0 }
    );

    ids.forEach((id) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });

    return () => observer.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return active;
}

function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.15 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);

  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0)" : "translateY(26px)",
        transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
      }}
    >
      {children}
    </div>
  );
}

function RotatingRole() {
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI((v) => (v + 1) % ROLES.length), 2600);
    return () => clearInterval(t);
  }, []);
  return (
    <span
      key={i}
      style={{ animation: "fadeSlideUp 0.5s ease" }}
      className="inline-block"
    >
      {ROLES[i]}
    </span>
  );
}

function Blob({ className, delay = "0s", duration = "12s" }) {
  return (
    <div
      className={`absolute rounded-full blur-3xl pointer-events-none ${className}`}
      style={{ animation: `blobMove ${duration} ease-in-out infinite`, animationDelay: delay }}
    />
  );
}

                      className={`absolute -left-8 top-5 w-3.5 h-3.5 rounded-full border-2 border-white ${

                      >
                        <div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-semibold text-slate-900 dark:text-white">
                              {job.title}
                            </span>
                            {job.current && (
                              <span className="text-xs font-medium bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded-full">
                                Current
                              </span>
                            )}
                          </div>
                          <div className="text-sm text-indigo-700 dark:text-indigo-300 font-medium mt-0.5">
                            {job.company}
                          </div>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                          <span className="text-sm text-slate-400 dark:text-slate-500 italic hidden sm:block">
                            {job.dates}
                          </span>
                          <ChevronDown
                            size={18}
                            className={`text-slate-400 dark:text-slate-500 transition-transform duration-300 ${
                              isOpen ? "rotate-180" : ""
                            }`}
                          />
                        </div>
                      </button>

                      <div className="sm:hidden px-5 pb-2 -mt-2 text-sm text-slate-400 dark:text-slate-500 italic">
                        {job.dates}
                      </div>

                      <div
                        style={{
                          maxHeight: isOpen ? "700px" : "0px",
                          overflow: "hidden",
                          transition: "max-height 0.45s ease",
                        }}
                      >
                        <ul className="px-5 pb-5 space-y-2 text-sm text-slate-600 dark:text-slate-400 list-disc list-outside ml-4">
                          {job.bullets.map((b, i) => (
                            <li key={i} className="leading-relaxed">
                              {b}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </Reveal>
                );
              })}
            </div>
          </div>
        </div>
      </section>

      {/* PROJECTS */}
      <section id="projects" className="max-w-5xl mx-auto px-6 py-20">
        <Reveal>
          <SectionHeading icon={Layers} text="Key Projects" />
        </Reveal>

        <div className="mt-10 grid sm:grid-cols-2 gap-5">
          {PROJECTS.map((p, i) => (
            <Reveal key={i} delay={i * 0.05}>
              <div className="group relative border border-slate-200 dark:border-slate-700 rounded-xl p-5 bg-white dark:bg-slate-900 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden">
                <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-300" />
                <div className="font-semibold text-slate-900 dark:text-white">{p.name}</div>
                <div className="text-sm text-indigo-700 dark:text-indigo-300 font-medium mt-0.5">
                  {p.org}
                </div>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
                  {p.desc}
                </p>
              </div>
            </Reveal>
          ))}
        </div>
      </section>

      {/* SKILLS */}
      <section id="skills" className="bg-white dark:bg-slate-900 border-y border-slate-200 dark:border-slate-800">
        <div className="max-w-5xl mx-auto px-6 py-20">
          <Reveal>
            <SectionHeading icon={Award} text="Skills" />
          </Reveal>

          <div className="mt-10 space-y-7">
            {Object.entries(SKILLS).map(([category, list], gi) => (
              <Reveal key={category} delay={gi * 0.08}>
                <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2.5">
                  {category}
                </h3>
                <div className="flex flex-wrap gap-2">
                  {list.map((skill) => (
                    <span
                      key={skill}
                      className="text-sm px-3 py-1.5 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-800 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900 hover:bg-indigo-100 dark:hover:bg-indigo-950 hover:scale-105 hover:shadow-sm transition-all cursor-default"
                    >
                      {skill}
                    </span>
                  ))}
                </div>
              </Reveal>
            ))}
          </div>

          <Reveal delay={0.2} className="mt-12">
            <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-4">
              Certifications &amp; Achievements
            </h3>

            <div className="flex items-center gap-3 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-950/40 dark:to-purple-950/40 border border-indigo-100 dark:border-indigo-900 rounded-xl px-4 py-3 mb-6">
              <div className="p-2 rounded-lg bg-white dark:bg-slate-800 shadow-sm shrink-0">
                <Trophy size={18} className="text-indigo-600 dark:text-indigo-300" />
              </div>
              <p className="text-sm">
                <span className="font-semibold text-slate-900 dark:text-white">
                  Won second place, Innovation Bootcamp
                </span>{" "}
                <span className="text-slate-400 dark:text-slate-500">
                  — Riyad Bank, Sep–Oct 2022
                </span>
              </p>
            </div>

            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {CERT_GROUPS.map((group, gi) => (
                <div
                  key={group.category}
                  className="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-white dark:bg-slate-900 hover:shadow-md hover:-translate-y-0.5 transition-all duration-300"
                >
                  <h4 className="text-xs font-bold tracking-wide text-indigo-700 dark:text-indigo-300 uppercase mb-2.5">
                    {group.category}
                  </h4>
                  <ul className="text-sm text-slate-600 dark:text-slate-400 space-y-2 list-disc list-outside ml-4">
                    {group.items.map((c, i) => (
                      <li key={i} className="leading-snug">
                        {c}
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </Reveal>
        </div>
      </section>

      {/* EDUCATION */}
      <section id="education" className="max-w-5xl mx-auto px-6 py-20">
        <Reveal>
          <SectionHeading icon={GraduationCap} text="Education" />
        </Reveal>

        <div className="mt-10 grid sm:grid-cols-2 gap-5">
          {EDUCATION.map((e, i) => (
            <Reveal key={i} delay={i * 0.08}>
              <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-5 bg-white dark:bg-slate-900 hover:shadow-md hover:-translate-y-1 transition-all duration-300 h-full">
                <div className="font-semibold text-slate-900 dark:text-white">{e.degree}</div>
                <div className="text-sm text-slate-500 dark:text-slate-400 mt-1.5">
                  {e.school}
                </div>
                <div className="text-sm text-indigo-600 dark:text-indigo-300 mt-0.5">
                  {e.dates}
                </div>
              </div>
            </Reveal>
          ))}
        </div>
      </section>

      {/* CONTACT / FOOTER */}
      <section
        id="contact"
        className="relative overflow-hidden bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950 py-20 px-6"
      >
        <Blob className="w-72 h-72 bg-indigo-500/20 -bottom-16 -left-10" duration="15s" />
        <Blob className="w-72 h-72 bg-purple-500/20 -top-16 -right-10" delay="3s" duration="17s" />

        <Reveal className="relative max-w-5xl mx-auto text-center">
          <h2 className="text-3xl font-bold gradient-text">Let's connect</h2>
          <p className="mt-3 text-indigo-200">
            Open to Product Management opportunities and collaborations.
          </p>
          <div className="mt-8 flex flex-wrap justify-center gap-4">
            <a
              href="mailto:aloufdrees@gmail.com"
              className="flex items-center gap-2 bg-white text-indigo-900 px-6 py-3 rounded-full font-medium hover:shadow-xl hover:scale-105 transition-all"
            >
              <Mail size={16} /> Email Me
            </a>
            <a
              href="https://www.linkedin.com/in/aloufaldrees"
              target="_blank"
              rel="noreferrer"
              className="flex items-center gap-2 border border-white/30 text-white px-6 py-3 rounded-full font-medium hover:bg-white/10 hover:scale-105 transition-all"
            >
              <Linkedin size={16} /> LinkedIn
            </a>
          </div>
          <p className="mt-10 text-xs text-indigo-300 italic">
            References available upon request.
          </p>
        </Reveal>
      </section>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Portfolio />);
</script>
</body>
</html>
